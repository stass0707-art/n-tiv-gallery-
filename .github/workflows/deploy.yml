name: Deploy n-tiv.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    env:
      DEPLOY_HOST: 45.157.161.97
      DEPLOY_USER: deploy
      DEPLOY_PORT: "22"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend
        working-directory: ./frontend
        run: |
          bun install
          bun run build

      - name: Restore and validate SSH key
        env:
          SSH_KEY_BASE64: ${{ secrets.VPS_SSH_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY_BASE64" || { echo "VPS_SSH_KEY_BASE64 is empty"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY_BASE64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Validate deployment target
        run: |
          set -euo pipefail
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "Invalid deployment user"; exit 1; }
          [[ "$DEPLOY_HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo "Invalid deployment host"; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo "Invalid SSH port"; exit 1; }
          echo "Deployment target validated: ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PORT}"

      - name: Verify SSH connection
        run: |
          set -euo pipefail
          ssh -vv \
            -i ~/.ssh/id_ed25519 \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "echo 'SSH connection successful'"

      - name: Prepare directories on VPS
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'set -eu; sudo mkdir -p /var/www/n-tiv/dist /opt/n-tiv-api; sudo chown -R deploy:deploy /var/www/n-tiv /opt/n-tiv-api; ls -ld /var/www/n-tiv/dist /opt/n-tiv-api'

      - name: Deploy frontend to VPS
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/id_ed25519 -p $DEPLOY_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            frontend/dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/n-tiv/dist/"

      - name: Deploy backend to VPS
        run: |
          set -euo pipefail
          rsync -az --delete --exclude='.env' \
            -e "ssh -i $HOME/.ssh/id_ed25519 -p $DEPLOY_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            backend/ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/n-tiv-api/"

      - name: Install dependencies and restart backend
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'set -eu; cd /opt/n-tiv-api; test -f .env || { echo "Backend .env is missing"; exit 1; }; npm ci; npm run build; npm run migrate; pm2 reload n-tiv-api || pm2 start dist/index.js --name n-tiv-api; pm2 save; npm prune --omit=dev'


      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/id_ed25519.pub

name: Deploy n-tiv.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    env:
      DEPLOY_HOST: 45.157.161.97
      DEPLOY_USER: deploy
      DEPLOY_PORT: "22"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend
        working-directory: ./frontend
        run: |
          bun install
          bun run build

      - name: Restore and validate SSH key
        env:
          SSH_KEY_BASE64: ${{ secrets.VPS_SSH_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY_BASE64" || { echo "VPS_SSH_KEY_BASE64 is empty"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY_BASE64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Open persistent SSH connection
        run: |
          set -euo pipefail
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "Invalid deployment user"; exit 1; }
          [[ "$DEPLOY_HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo "Invalid deployment host"; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo "Invalid SSH port"; exit 1; }
          rm -f /tmp/n-tiv-ssh-control
          ssh -MNf \
            -i ~/.ssh/id_ed25519 \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ControlMaster=yes \
            -o ControlPath=/tmp/n-tiv-ssh-control \
            -o ControlPersist=15m \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -S /tmp/n-tiv-ssh-control -O check "${DEPLOY_USER}@${DEPLOY_HOST}"
          echo "Persistent SSH connection opened: ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PORT}"

      - name: Prepare server directories and check backend environment
        run: |
          set -euo pipefail
          ssh \
            -S /tmp/n-tiv-ssh-control \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'set -eu
             ensure_dir() {
               dir="$1"
               if [ ! -d "$dir" ]; then
                 mkdir -p "$dir" 2>/dev/null || sudo -n mkdir -p "$dir"
               fi
               if [ ! -w "$dir" ]; then
                 sudo -n chown -R "$(id -un):$(id -gn)" "$dir"
               fi
               test -w "$dir" || { echo "Directory is not writable: $dir"; exit 1; }
               echo "Ready: $dir"
             }
             ensure_dir /var/www/n-tiv/dist
             ensure_dir /var/www/n-tiv/uploads
             ensure_dir /opt/n-tiv-api
             test -f /opt/n-tiv-api/.env || { echo "Backend environment file is missing: /opt/n-tiv-api/.env"; exit 1; }
             echo "Server directories and backend environment are ready"'

      - name: Deploy frontend to VPS
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -S /tmp/n-tiv-ssh-control" \
            frontend/dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/n-tiv/dist/"

      - name: Deploy backend to VPS
        run: |
          set -euo pipefail
          rsync -az --delete --exclude='.env' \
            -e "ssh -S /tmp/n-tiv-ssh-control" \
            backend/ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/n-tiv-api/"

      - name: Install dependencies and restart backend
        run: |
          set -euo pipefail
          ssh \
            -S /tmp/n-tiv-ssh-control \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'set -eu; cd /opt/n-tiv-api; test -f .env || { echo "Backend .env is missing"; exit 1; }; npm ci; npm run build; npm run migrate; pm2 reload n-tiv-api || pm2 start dist/index.js --name n-tiv-api; pm2 save; npm prune --omit=dev'

      - name: Close SSH connection and remove temporary key
        if: always()
        run: |
          ssh -S /tmp/n-tiv-ssh-control -O exit "${DEPLOY_USER}@${DEPLOY_HOST}" 2>/dev/null || true
          rm -f /tmp/n-tiv-ssh-control ~/.ssh/id_ed25519 ~/.ssh/id_ed25519.pub

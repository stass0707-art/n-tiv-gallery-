name: Deploy n-tiv.ru

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend
        working-directory: ./frontend
        run: |
          bun install
          bun run build

      - name: Deploy frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/var/www/n-tiv/dist"
          strip_components: 2
          rm: true

      - name: Preserve backend .env
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if [ -f /opt/n-tiv-api/.env ]; then
              cp /opt/n-tiv-api/.env /tmp/n-tiv-api-env-backup
            fi

      - name: Deploy backend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/*"
          target: "/opt/n-tiv-api"
          strip_components: 1
          rm: true

      - name: Restore backend .env
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if [ -f /tmp/n-tiv-api-env-backup ]; then
              cp /tmp/n-tiv-api-env-backup /opt/n-tiv-api/.env
              rm -f /tmp/n-tiv-api-env-backup
            fi
            chown -R deploy:deploy /opt/n-tiv-api

      - name: Install dependencies and restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/n-tiv-api
            npm ci --omit=dev
            npm run build
            npm run migrate
            pm2 reload n-tiv-api || pm2 start dist/index.js --name n-tiv-api
            pm2 save

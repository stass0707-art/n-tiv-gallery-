name: Deploy n-tiv.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend
        working-directory: ./frontend
        run: |
          bun install
          bun run build

      - name: Restore and validate SSH key
        env:
          SSH_KEY_BASE64: ${{ secrets.VPS_SSH_KEY_BASE64 }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY_BASE64" || { echo "VPS_SSH_KEY_BASE64 is empty"; exit 1; }
          test -n "$VPS_HOST" || { echo "VPS_HOST is empty"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY_BASE64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Verify SSH connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER" || { echo "VPS_USER is empty"; exit 1; }
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "echo 'SSH connection successful'"

      - name: Deploy frontend to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            frontend/dist/ "$VPS_USER@$VPS_HOST:/var/www/n-tiv/dist/"

      - name: Deploy backend to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete --exclude='.env' -e "ssh -i ~/.ssh/id_ed25519" \
            backend/ "$VPS_USER@$VPS_HOST:/opt/n-tiv-api/"

      - name: Install dependencies and restart backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" <<'EOF'
            set -euo pipefail
            cd /opt/n-tiv-api
            test -f .env || { echo "Backend .env is missing"; exit 1; }
            npm ci
            npm run build
            npm run migrate
            pm2 reload n-tiv-api || pm2 start dist/index.js --name n-tiv-api
            pm2 save
            npm prune --omit=dev
          EOF

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
